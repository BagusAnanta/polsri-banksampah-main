services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banksampah_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - banksampah

  nginx:
    image: nginx:latest
    container_name: banksampah_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - banksampah

  db:
    image: mysql:8
    container_name: banksampah_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: banksampahfix
      MYSQL_USER: dev
      MYSQL_PASSWORD: banksampahfixdatabases
      MYSQL_ROOT_PASSWORD: banksampahfixdatabases
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - banksampah

networks:
  banksampah:
    driver: bridge

volumes:
  mysql_data:
